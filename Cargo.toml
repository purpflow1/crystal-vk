[package]
name = "crystal-vk"
version = "0.0.1"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
overflow-checks = true

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
raw-window-handle = "0.6.2"

[dev-dependencies]
shaderc = "0.10.1"
winit = { version = "0.30.10", features = ["rwh_06"] }
glam = "0.30.3"
png = "0.18.0"
futures = "0.3.31"
